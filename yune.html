<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#fbfdff">
    <meta name="description" content="Tampilan halaman website toko online Yune.co karya Annisa Nur Utami (Runa).">
    <title>Yune.co — Annisa Nur Utami</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Caveat:wght@500;600;700&family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&family=Sniglet:wght@400;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="yune.css">
    <script src="yune.js" defer></script>
  </head>
  <body>

    <header class="project-header">
      <a class="back-link" href="index.html#portofolio">← Kembali ke portofolio</a>
      <span class="project-brand">Runa<span>.</span></span>
    </header>

    <section class="project-intro">
      <p class="project-kicker">PROYEK 06 · E-COMMERCE</p>
      <h1>Yune<span>.co</span></h1>
      <p class="project-desc">
        Website toko online untuk merchandise anime, mainan, dan barang koleksi. Di dalamnya ada halaman katalog produk, fitur pencarian, profil toko, dan halaman berita.
      </p>
      <ul class="project-tags" aria-label="Kategori proyek">
        <li>E-Commerce</li>
        <li>Katalog Produk</li>
        <li>Online Store</li>
      </ul>
    </section>

    <section class="gallery" aria-label="Pratinjau halaman website Yune.co">
      <div class="slide-frame" id="slides">
        <figure class="slide is-active" aria-hidden="false">
          <img src="assets/projects/yune-shop-home.png" alt="Tampilan halaman beranda website Yune.co">
          <figcaption>01 Beranda toko Yune.co</figcaption>
        </figure>
        <figure class="slide" aria-hidden="true">
          <img src="assets/projects/yune-shop-products.png" alt="Tampilan katalog produk website Yune.co" loading="lazy">
          <figcaption>02 Daftar dan katalog produk</figcaption>
        </figure>
        <figure class="slide" aria-hidden="true">
          <img src="assets/projects/yune-shop-about.png" alt="Tampilan halaman tentang Yune.co" loading="lazy">
          <figcaption>03 Informasi tentang Yune.co</figcaption>
        </figure>
        <figure class="slide" aria-hidden="true">
          <img src="assets/projects/yune-shop-news.png" alt="Tampilan halaman berita website Yune.co" loading="lazy">
          <figcaption>04 Kabar dan update terbaru toko</figcaption>
        </figure>
      </div>

      <div class="gallery-controls">
        <button class="slide-btn slide-prev" type="button" aria-label="Slide sebelumnya" aria-controls="slides">←</button>
        <div class="dot-track" role="tablist" aria-label="Pilih slide">
          <button class="dot is-active" type="button" role="tab" aria-selected="true" data-index="0" aria-label="Slide 1"></button>
          <button class="dot" type="button" role="tab" aria-selected="false" data-index="1" aria-label="Slide 2"></button>
          <button class="dot" type="button" role="tab" aria-selected="false" data-index="2" aria-label="Slide 3"></button>
          <button class="dot" type="button" role="tab" aria-selected="false" data-index="3" aria-label="Slide 4"></button>
        </div>
        <button class="slide-btn slide-next" type="button" aria-label="Slide berikutnya" aria-controls="slides">→</button>
      </div>
    </section>

  </body>
</html>
